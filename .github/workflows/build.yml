name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build ./Jellyfin.Plugin.UpcomingEpisodes/Jellyfin.Plugin.UpcomingEpisodes.csproj -c Release --warnaserror

      - name: Validate manifest.json
        run: jq -e 'type == "array" and length > 0 and (.[0] | has("guid") and has("versions"))' manifest.json > /dev/null
